<header class="navbar">
  <div class="container">
    <div class="navbar-content">
      <div class="navbar-brand-group">
        <button type="button"
                class="btn-global-menu"
                (click)="openGlobalMenu()"
                title="Menu Geral do Sistema (Ctrl+K)"
                aria-label="Abrir Menu Geral do Sistema">
          <i class="fas fa-bars" aria-hidden="true"></i>
          <span class="btn-global-menu-label">Menu</span>
        </button>
        <app-logo size="md"></app-logo>
      </div>

      <!-- Ações do usuário (Notificações, Carrinho, Minha conta, Sair) -->
      <app-nav-actions class="navbar-actions"></app-nav-actions>
    </div>
  </div>
</header>
