<header class="navbar">
  <div class="container">
    <div class="navbar-content">
      <app-logo size="md"></app-logo>

      <button type="button" class="menu-toggle" (click)="toggleMenu()" *ngIf="isMobile"
              [attr.aria-label]="isMenuOpen ? 'Fechar menu de navegação' : 'Abrir menu de navegação'"
              [attr.aria-expanded]="isMenuOpen"
              aria-controls="main-nav">
        <span class="icon" aria-hidden="true" [ngClass]="{'icon-menu': !isMenuOpen, 'icon-x': isMenuOpen}"></span>
      </button>

      <nav id="main-nav" class="nav" [ngClass]="{'nav-open': isMenuOpen}" aria-label="Navegação principal">
        <ul class="nav-list">
          <li class="nav-item">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Home</a>
          </li>
          <li class="nav-item">
            <a routerLink="/services" routerLinkActive="active" (click)="closeMenu()">Serviços</a>
          </li>
          <li class="nav-item">
            <a routerLink="/products" routerLinkActive="active" (click)="closeMenu()">Produtos</a>
          </li>
          <li class="nav-item">
            <a routerLink="/appointments" routerLinkActive="active" (click)="closeMenu()">Agendamentos</a>
          </li>
          <li class="nav-item">
            <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contato</a>
          </li>
          <li class="nav-item">
            <a routerLink="/orders" routerLinkActive="active" (click)="closeMenu()">Meus Pedidos</a>
          </li>
          <li class="nav-item">
            <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu()">Dashboard</a>
          </li>
        </ul>
        <div class="nav-actions">
          <a routerLink="/cart" class="cart-link" (click)="closeMenu()" aria-label="Carrinho de compras">
            <i class="fas fa-shopping-cart" aria-hidden="true"></i>
            <ng-container *ngIf="cartCount$ | async as count">
              <span class="cart-badge" *ngIf="count > 0">{{ count }}</span>
            </ng-container>
          </a>
          <ng-container *ngIf="currentUser$ | async as user; else loginButton">
            <span class="nav-user">{{ user.name }}</span>
            <button class="btn btn-outline-secondary" (click)="logout(); closeMenu()">Sair</button>
          </ng-container>
          <ng-template #loginButton>
            <a routerLink="/login" class="btn btn-primary" (click)="closeMenu()">Login</a>
          </ng-template>
        </div>
      </nav>
    </div>
  </div>
</header>
