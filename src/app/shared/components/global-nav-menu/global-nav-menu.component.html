<!-- Backdrop Overlay (clique fecha o menu deslizante) -->
<div class="drawer-backdrop" [class.open]="isOpen" (click)="close()" aria-hidden="true"></div>

<!-- Gaveta Deslizante Lateral (Offcanvas Drawer) -->
<aside class="global-nav-drawer" [class.open]="isOpen" role="dialog" aria-modal="true" aria-label="Menu Geral do Sistema">

  <!-- 1. Header do Drawer -->
  <div class="drawer-header">
    <div class="brand-group">
      <div class="brand-icon">
        <i class="fas fa-paw"></i>
      </div>
      <div>
        <h2 class="drawer-title">
          Menu do Sistema
          <span class="count-pill">{{ totalCount }}</span>
        </h2>
        <span class="drawer-subtitle">Navegação geral do Animal World</span>
      </div>
    </div>

    <button type="button" class="btn-close-drawer" (click)="close()" title="Fechar menu (ESC)" aria-label="Fechar menu">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <!-- 2. Busca e Filtros Rápidos -->
  <div class="drawer-search-area">
    <div class="search-input-wrapper">
      <i class="fas fa-search search-icon" aria-hidden="true"></i>
      <input #searchInput
             type="text"
             class="drawer-search-input"
             placeholder="Buscar telas (ex: tosa, remédio, caixa)..."
             [(ngModel)]="searchQuery"
             (keyup.escape)="close()"
             aria-label="Buscar telas do sistema">
      <button *ngIf="searchQuery" type="button" class="btn-clear-search" (click)="clearSearch()" title="Limpar busca">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Pílulas de Categoria em Scroll Horizontal -->
    <div class="category-chips">
      <button type="button" class="chip-btn" [class.active]="selectedCategory === 'all'" (click)="setCategory('all')">
        Todos ({{ allRoutes.length }})
      </button>
      <button type="button" class="chip-btn" [class.active]="selectedCategory === 'operacao'" (click)="setCategory('operacao')">
        ✂️ Operação
      </button>
      <button type="button" class="chip-btn" [class.active]="selectedCategory === 'cadastros'" (click)="setCategory('cadastros')">
        📋 Cadastros
      </button>
      <button type="button" class="chip-btn" [class.active]="selectedCategory === 'financeiro'" (click)="setCategory('financeiro')">
        💼 Financeiro
      </button>
      <button type="button" class="chip-btn" [class.active]="selectedCategory === 'publico'" (click)="setCategory('publico')">
        🛍️ Loja
      </button>
    </div>
  </div>

  <!-- 3. Lista de Rotas com Rolagem Suave -->
  <div class="drawer-content">

    <!-- Mensagem de resultado vazio -->
    <div class="empty-state" *ngIf="filteredRoutes.length === 0">
      <i class="fas fa-search-minus empty-icon"></i>
      <p class="empty-text">Nenhuma tela para "<strong>{{ searchQuery }}</strong>"</p>
      <button type="button" class="btn-reset" (click)="clearSearch()">Mostrar todas</button>
    </div>

    <!-- SEÇÃO 1: OPERAÇÃO BANHO, TOSA & CLÍNICA -->
    <div class="drawer-section" *ngIf="getRoutesByCategory('operacao').length > 0">
      <div class="section-label label-operacao">
        <i class="fas fa-cut"></i>
        <span>Operação & Atendimento</span>
      </div>
      <div class="section-items">
        <button type="button"
                class="drawer-item"
                *ngFor="let item of getRoutesByCategory('operacao')"
                (click)="navigate(item.path)">
          <div class="item-icon-box">
            <i [class]="item.icon"></i>
          </div>
          <div class="item-body">
            <div class="item-top">
              <span class="item-name">{{ item.title }}</span>
              <span class="item-badge" [class]="item.badgeClass" *ngIf="item.badge">{{ item.badge }}</span>
            </div>
            <p class="item-description">{{ item.description }}</p>
          </div>
          <i class="fas fa-chevron-right item-arrow"></i>
        </button>
      </div>
    </div>

    <!-- SEÇÃO 2: CENTRAL DE CADASTROS -->
    <div class="drawer-section" *ngIf="getRoutesByCategory('cadastros').length > 0">
      <div class="section-label label-cadastros">
        <i class="fas fa-folder-open"></i>
        <span>Central de Cadastros</span>
      </div>
      <div class="section-items">
        <button type="button"
                class="drawer-item"
                *ngFor="let item of getRoutesByCategory('cadastros')"
                (click)="navigate(item.path)">
          <div class="item-icon-box">
            <i [class]="item.icon"></i>
          </div>
          <div class="item-body">
            <div class="item-top">
              <span class="item-name">{{ item.title }}</span>
              <span class="item-badge" [class]="item.badgeClass" *ngIf="item.badge">{{ item.badge }}</span>
            </div>
            <p class="item-description">{{ item.description }}</p>
          </div>
          <i class="fas fa-chevron-right item-arrow"></i>
        </button>
      </div>
    </div>

    <!-- SEÇÃO 3: FINANCEIRO & GESTÃO -->
    <div class="drawer-section" *ngIf="getRoutesByCategory('financeiro').length > 0">
      <div class="section-label label-financeiro">
        <i class="fas fa-chart-pie"></i>
        <span>Financeiro & Gestão</span>
      </div>
      <div class="section-items">
        <button type="button"
                class="drawer-item"
                *ngFor="let item of getRoutesByCategory('financeiro')"
                (click)="navigate(item.path)">
          <div class="item-icon-box">
            <i [class]="item.icon"></i>
          </div>
          <div class="item-body">
            <div class="item-top">
              <span class="item-name">{{ item.title }}</span>
              <span class="item-badge" [class]="item.badgeClass" *ngIf="item.badge">{{ item.badge }}</span>
            </div>
            <p class="item-description">{{ item.description }}</p>
          </div>
          <i class="fas fa-chevron-right item-arrow"></i>
        </button>
      </div>
    </div>

    <!-- SEÇÃO 4: LOJA & ÁREA DO CLIENTE -->
    <div class="drawer-section" *ngIf="getRoutesByCategory('publico').length > 0">
      <div class="section-label label-publico">
        <i class="fas fa-store"></i>
        <span>Loja & Tutor (Público)</span>
      </div>
      <div class="section-items">
        <button type="button"
                class="drawer-item"
                *ngFor="let item of getRoutesByCategory('publico')"
                (click)="navigate(item.path)">
          <div class="item-icon-box">
            <i [class]="item.icon"></i>
          </div>
          <div class="item-body">
            <div class="item-top">
              <span class="item-name">{{ item.title }}</span>
              <span class="item-badge" [class]="item.badgeClass" *ngIf="item.badge">{{ item.badge }}</span>
            </div>
            <p class="item-description">{{ item.description }}</p>
          </div>
          <i class="fas fa-chevron-right item-arrow"></i>
        </button>
      </div>
    </div>

  </div>

  <!-- 4. Footer do Drawer -->
  <div class="drawer-footer">
    <button type="button" class="btn-view-sitemap" (click)="navigate('/dashboard/rotas')">
      <i class="fas fa-sitemap"></i>
      <span>Ver Mapa Completo de Rotas</span>
      <i class="fas fa-arrow-right ms-auto"></i>
    </button>
    <div class="footer-bottom-info">
      <span>Atalho: <code>Ctrl + K</code></span>
      <span>Pressione <code>ESC</code> para fechar</span>
    </div>
  </div>

</aside>
