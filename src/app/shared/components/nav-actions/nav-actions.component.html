<div class="nav-actions">
  <div class="notif" *ngIf="isStaff">
    <button type="button" class="notif-btn" (click)="toggleNotif()"
            aria-label="Notificações"
            [attr.aria-expanded]="notifOpen"
            aria-haspopup="true">
      <i class="fas fa-bell" aria-hidden="true"></i>
      <span class="cart-badge" *ngIf="pendingCount > 0">{{ pendingCount }}</span>
    </button>
    <div class="notif-dropdown" *ngIf="notifOpen" role="menu" aria-label="Pendências">
      <p class="notif-empty" *ngIf="pendingCount === 0">Nenhuma pendência.</p>
      <ng-container *ngIf="pendingAppointments.length > 0">
        <p class="notif-group">Agendamentos solicitados</p>
        <a class="notif-item" *ngFor="let a of pendingAppointments | slice:0:5"
           routerLink="/dashboard/appointments" (click)="onAction()">
          {{ a.petName }} — {{ a.date }} {{ a.time }}
        </a>
      </ng-container>
      <ng-container *ngIf="pendingOrders.length > 0">
        <p class="notif-group">Pedidos pendentes</p>
        <a class="notif-item" *ngFor="let o of pendingOrders | slice:0:5"
           routerLink="/dashboard/orders" (click)="onAction()">
          {{ o.orderNumber }} — {{ o.customerName }}
        </a>
      </ng-container>
    </div>
  </div>

  <a routerLink="/cart" class="cart-link" (click)="onAction()" aria-label="Carrinho de compras">
    <i class="fas fa-shopping-cart" aria-hidden="true"></i>
    <ng-container *ngIf="cartCount$ | async as count">
      <span class="cart-badge" *ngIf="count > 0">{{ count }}</span>
    </ng-container>
  </a>

  <ng-container *ngIf="currentUser$ | async as user; else loginButton">
    <a routerLink="/account" class="btn btn-outline-secondary" (click)="onAction()">Minha conta</a>
    <span class="nav-user">{{ user.name }}</span>
    <button type="button" class="btn btn-outline-secondary" (click)="logout()">Sair</button>
  </ng-container>

  <ng-template #loginButton>
    <a routerLink="/login" class="btn btn-primary" (click)="onAction()">Login</a>
  </ng-template>
</div>
