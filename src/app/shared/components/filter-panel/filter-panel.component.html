<div class="filter-panel-card bg-background rounded-xl shadow-card p-6">
  <app-category-filter
    [categories]="categories"
    [activeCategory]="activeCategory"
    (categoryChange)="onCategoryChange($event)"
  ></app-category-filter>

  <div class="filter-group-more mt-8">
    <h3 class="filter-group-title text-lg font-semibold">Filtrar por</h3>
    
    <div class="filter-group-items space-y-6 mt-3">
      <app-price-slider
        [min]="minPrice"
        [max]="maxPrice"
        [value]="selectedPrice"
        (valueChange)="onPriceSliderChange($event)"
      ></app-price-slider>

      <app-rating-filter
        [ratingOptions]="ratingOptions"
        [selectedRatings]="selectedRatings"
        (ratingChange)="onRatingFilterChange($event)"
      ></app-rating-filter>

      <app-duration-filter
        *ngIf="showDurationFilter"
        [durationOptions]="durationOptions"
        [selectedDurations]="selectedDurations"
        (durationChange)="onDurationFilterChange($event)"
      ></app-duration-filter>
    </div>
  </div>
</div>
