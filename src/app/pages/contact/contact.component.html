<div class="contact-container">
  <app-section-heading title="Fale Conosco" subtitle="Adoraríamos ouvir você"></app-section-heading>
  
  <div class="contact-content">
    <div class="contact-info">
      <div class="info-card">
        <div class="info-icon">
          <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
        </div>
        <h3>Nosso Endereço</h3>
        <p>Av. Paulista, 1000</p>
        <p>São Paulo, SP</p>
      </div>
      
      <div class="info-card">
        <div class="info-icon">
          <i class="fas fa-phone-alt" aria-hidden="true"></i>
        </div>
        <h3>Telefone</h3>
        <p>(11) 99999-9999</p>
        <p>Seg–Sex: 9h às 18h</p>
      </div>
      
      <div class="info-card">
        <div class="info-icon">
          <i class="fas fa-envelope" aria-hidden="true"></i>
        </div>
        <h3>E-mail</h3>
        <p>contato@animalworld.com</p>
        <p>suporte@animalworld.com</p>
      </div>
    </div>
    
    <div class="contact-form-container">
      <h3>Envie sua mensagem</h3>
      <form class="contact-form">
        <div class="form-group">
          <label for="name">Seu nome</label>
          <input type="text" id="name" class="form-control" placeholder="Digite seu nome">
        </div>
        
        <div class="form-group">
          <label for="email">Seu e-mail</label>
          <input type="email" id="email" class="form-control" placeholder="Digite seu e-mail">
        </div>
        
        <div class="form-group">
          <label for="subject">Assunto</label>
          <input type="text" id="subject" class="form-control" placeholder="Digite o assunto">
        </div>
        
        <div class="form-group">
          <label for="message">Mensagem</label>
          <textarea id="message" class="form-control" rows="5" placeholder="Digite sua mensagem"></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary">Enviar mensagem</button>
      </form>
    </div>
  </div>
</div>
