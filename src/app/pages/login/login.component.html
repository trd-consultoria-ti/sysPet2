<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>{{ isRegisterMode ? 'Criar Conta' : 'Bem-vindo de Volta' }}</h1>
      <p>{{ isRegisterMode ? 'Cadastre-se para agendar e acompanhar pedidos' : 'Entre na sua conta' }}</p>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()">
      <div class="alert alert-danger" *ngIf="error" role="alert" aria-live="polite">
        {{ error }}
      </div>

      <div class="form-group" *ngIf="isRegisterMode">
        <label for="name">Nome</label>
        <input type="text" id="name" class="form-control" placeholder="Seu nome completo"
               [(ngModel)]="name" name="name" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" placeholder="Digite seu email" 
               [(ngModel)]="email" name="email" required>
      </div>
      
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" class="form-control" placeholder="Digite sua senha" 
               [(ngModel)]="password" name="password" required>
      </div>
      
      <div class="form-options" *ngIf="isRegisterMode">
        <label class="remember-me" for="accept-terms">
          <input type="checkbox" id="accept-terms" name="acceptTerms" [(ngModel)]="acceptTerms">
          Aceito os termos e a política de privacidade
        </label>
      </div>

      <div class="form-options" *ngIf="!isRegisterMode">
        <div class="remember-me">
          <input type="checkbox" id="remember">
          <label for="remember">Lembrar-me</label>
        </div>
        <button type="button" class="forgot-password" (click)="forgot()">Esqueceu a senha?</button>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading || (isRegisterMode && !acceptTerms)">
        <i *ngIf="loading" class="fas fa-spinner fa-spin" aria-hidden="true"></i>
        {{ isRegisterMode ? 'Cadastrar' : 'Entrar' }}
      </button>

      <p class="toggle-mode">
        {{ isRegisterMode ? 'Já tem conta?' : 'Não tem conta?' }}
        <button type="button" class="link-button" (click)="toggleMode()">
          {{ isRegisterMode ? 'Entrar' : 'Criar conta' }}
        </button>
      </p>

      <div class="demo-quick-login" *ngIf="!isRegisterMode" style="margin-top: 1.25rem; padding: 0.85rem; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; text-align: center;">
        <p style="margin: 0 0 0.5rem; font-size: 0.8rem; font-weight: 600; color: #475569;">Acesso Rápido de Teste:</p>
        <div style="display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;">
          <button type="button" class="btn btn-sm btn-outline-secondary" (click)="fillAdmin()" style="font-size: 0.75rem; padding: 0.35rem 0.6rem; border-radius: 6px; border: 1px solid #94a3b8; background: #fff; color: #1e293b; font-weight: 500; cursor: pointer;" aria-label="Preencher credenciais do Administrador">
            👑 Admin (admin@animalworld.com)
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary" (click)="fillCollab()" style="font-size: 0.75rem; padding: 0.35rem 0.6rem; border-radius: 6px; border: 1px solid #94a3b8; background: #fff; color: #1e293b; font-weight: 500; cursor: pointer;" aria-label="Preencher credenciais da Equipe">
            ✂️ Equipe (func@animalworld.com)
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
