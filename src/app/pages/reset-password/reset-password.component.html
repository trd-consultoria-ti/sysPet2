<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Redefinir Senha</h1>
      <p>Escolha uma nova senha para a sua conta</p>
    </div>

    <div *ngIf="success" class="alert alert-success">
      Senha redefinida com sucesso!
      <button type="button" class="link-button" (click)="goToLogin()">Ir para o login</button>
    </div>

    <form *ngIf="!success" class="login-form" (ngSubmit)="onSubmit()">
      <div class="alert alert-danger" *ngIf="error">
        {{ error }}
      </div>

      <div class="form-group">
        <label for="newPassword">Nova senha</label>
        <input type="password" id="newPassword" class="form-control" placeholder="Mínimo 8 caracteres, com letra e número"
               [(ngModel)]="newPassword" name="newPassword" required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar nova senha</label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="Repita a nova senha"
               [(ngModel)]="confirmPassword" name="confirmPassword" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading || !token">
        <i *ngIf="loading" class="fas fa-spinner fa-spin" aria-hidden="true"></i>
        Redefinir senha
      </button>

      <p class="toggle-mode">
        Lembrou a senha?
        <button type="button" class="link-button" (click)="goToLogin()">Entrar</button>
      </p>
    </form>
  </div>
</div>
