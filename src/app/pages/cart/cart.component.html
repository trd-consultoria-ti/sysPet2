<div class="cart-container">
  <h1 class="cart-title">Seu Carrinho</h1>

  <div class="cart-empty" *ngIf="items.length === 0">
    <i class="fas fa-shopping-cart"></i>
    <p>Seu carrinho está vazio.</p>
    <a routerLink="/products" class="btn btn-primary">Ver Produtos</a>
  </div>

  <div class="cart-content" *ngIf="items.length !== 0">
    <div class="cart-items">
      <div class="cart-item" *ngFor="let item of items">
        <img [src]="item.image" [alt]="item.name" class="cart-item-image">
        <div class="cart-item-info">
          <h3 class="cart-item-name">{{ item.name }}</h3>
          <span class="cart-item-price">R$ {{ formatPrice(item.price) }}</span>
        </div>
        <div class="cart-item-qty">
          <button class="qty-btn" (click)="decrement(item)" aria-label="Diminuir">−</button>
          <span class="qty-value">{{ item.quantity }}</span>
          <button class="qty-btn" (click)="increment(item)" aria-label="Aumentar">+</button>
        </div>
        <div class="cart-item-total">R$ {{ formatPrice(itemTotal(item)) }}</div>
        <button class="cart-item-remove" (click)="remove(item)" aria-label="Remover">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>

    <div class="cart-summary">
      <div class="summary-row">
        <span>Subtotal</span>
        <span>R$ {{ formatPrice(total) }}</span>
      </div>
      <div class="summary-row summary-total">
        <span>Total</span>
        <span>R$ {{ formatPrice(total) }}</span>
      </div>
      <a routerLink="/checkout" class="btn btn-primary btn-block">Finalizar Compra</a>
      <a routerLink="/products" class="btn btn-outline-secondary btn-block">Continuar Comprando</a>
    </div>
  </div>
</div>
