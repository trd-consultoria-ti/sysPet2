<div class="admin-page">
  <div class="page-header">
    <h1>Serviços</h1>
    <button class="btn btn-primary" (click)="openCreate()">+ Novo serviço</button>
  </div>

  <form class="service-form" *ngIf="showForm" [formGroup]="serviceForm" (ngSubmit)="save()">
    <h2>{{ editingId ? 'Editar serviço' : 'Novo serviço' }}</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Nome *</label>
        <input type="text" formControlName="name">
      </div>
      <div class="form-group form-group-sm">
        <label>Preço (R$) *</label>
        <input type="number" formControlName="price" min="0" step="0.01">
      </div>
      <div class="form-group form-group-sm">
        <label>Duração</label>
        <input type="text" formControlName="duration" placeholder="Ex: 60 min">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Categoria</label>
        <input type="text" formControlName="category">
      </div>
      <div class="form-group">
        <label>Descrição</label>
        <input type="text" formControlName="description">
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="serviceForm.invalid">Salvar</button>
      <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancelar</button>
    </div>
  </form>

  <div class="empty-state" *ngIf="services.length === 0">
    <p>Nenhum serviço cadastrado.</p>
  </div>

  <div class="table-container" *ngIf="services.length > 0">
    <table class="data-table">
      <thead>
        <tr>
          <th>Serviço</th>
          <th>Categoria</th>
          <th>Duração</th>
          <th>Preço</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let service of services">
          <td>{{ service.name }}</td>
          <td>{{ service.category }}</td>
          <td>{{ service.duration }}</td>
          <td>R$ {{ formatPrice(service.price) }}</td>
          <td class="actions-cell">
            <button class="btn btn-sm btn-outline-primary" (click)="startEdit(service)">Editar</button>
            <button class="btn btn-sm btn-outline-danger" (click)="remove(service)">Excluir</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
