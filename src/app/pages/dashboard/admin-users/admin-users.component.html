<div class="admin-page">
  <div class="page-header">
    <h1>Usuários</h1>
    <button class="btn btn-primary" (click)="openCreate()">+ Novo usuário</button>
  </div>

  <form class="user-form" *ngIf="showForm" [formGroup]="userForm" (ngSubmit)="save()">
    <h2>Novo usuário</h2>
    <p class="form-error" *ngIf="error" role="alert">{{ error }}</p>
    <div class="form-row">
      <div class="form-group">
        <label for="user-name">Nome *</label>
        <input id="user-name" type="text" formControlName="name">
      </div>
      <div class="form-group">
        <label for="user-email">Email *</label>
        <input id="user-email" type="email" formControlName="email">
      </div>
      <div class="form-group">
        <label for="user-password">Senha * (mín. 6)</label>
        <input id="user-password" type="password" formControlName="password">
      </div>
      <div class="form-group form-group-sm">
        <label for="user-role">Perfil</label>
        <select id="user-role" formControlName="role">
          <option *ngFor="let r of roles" [value]="r.value">{{ r.label }}</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <label class="perm-check">
        <input type="checkbox" formControlName="canManageProducts">
        Pode gerenciar produtos no estoque
      </label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid">Salvar</button>
      <button type="button" class="btn btn-outline-secondary" (click)="cancel()">Cancelar</button>
    </div>
  </form>

  <div class="table-container">
    <table class="data-table">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Email</th>
          <th>Perfil</th>
          <th>Gerencia produtos</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>
            <select class="role-select" [value]="user.role" (change)="changeRole(user, $any($event.target).value)">
              <option *ngFor="let r of roles" [value]="r.value">{{ r.label }}</option>
            </select>
          </td>
          <td>
            <input type="checkbox" [checked]="!!user.canManageProducts" [disabled]="user.role !== 'collaborator'"
                   (change)="toggleProductPermission(user, $event)">
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
