<div class="dashboard-container">
  <div class="dashboard-content">
    <!-- Sidebar de navegação -->
    <div class="dashboard-sidebar">
      <div class="sidebar-header">
        <span class="sidebar-brand">Animal World</span>
      </div>
      <ul class="sidebar-menu">
        <li class="sidebar-item">
          <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <i class="fas fa-home"></i> Painel
          </a>
        </li>
        <li class="sidebar-item">
          <a routerLink="/dashboard/customers" routerLinkActive="active">
            <i class="fas fa-users"></i> Clientes & Pets
          </a>
        </li>
        <li class="sidebar-item">
          <a routerLink="/dashboard/appointments" routerLinkActive="active">
            <i class="fas fa-calendar-alt"></i> Agendamentos
          </a>
        </li>
        <li class="sidebar-item">
          <a routerLink="/dashboard/orders" routerLinkActive="active">
            <i class="fas fa-shopping-bag"></i> Pedidos
          </a>
        </li>
        <li class="sidebar-item">
          <a routerLink="/dashboard/inventory" routerLinkActive="active">
            <i class="fas fa-box"></i> Estoque
          </a>
        </li>
        <li class="sidebar-item" *ngIf="isAdmin">
          <a routerLink="/dashboard/services" routerLinkActive="active">
            <i class="fas fa-concierge-bell"></i> Serviços
          </a>
        </li>
        <li class="sidebar-item" *ngIf="isAdmin">
          <a routerLink="/dashboard/users" routerLinkActive="active">
            <i class="fas fa-user-cog"></i> Usuários
          </a>
        </li>
        <li class="sidebar-item" *ngIf="isAdmin">
          <a routerLink="/dashboard/cash" routerLinkActive="active">
            <i class="fas fa-cash-register"></i> Caixa
          </a>
        </li>
        <li class="sidebar-item">
          <button type="button" class="sidebar-logout" (click)="logout()">
            <i class="fas fa-sign-out-alt" aria-hidden="true"></i> Sair
          </button>
        </li>
      </ul>
    </div>

    <!-- Conteúdo principal -->
    <div class="dashboard-main">
      <!-- Cabeçalho com informações do usuário -->
      <div class="dashboard-header">
        <div class="user-info">
          <span class="welcome-text">Olá, {{ user?.name || 'Visitante' }}</span>
          <span class="user-role">{{ user?.role === 'admin' ? 'Administrador' : (user?.role === 'collaborator' ? 'Colaborador' : 'Cliente') }}</span>
        </div>
      </div>

      <!-- Voltar link -->
      <div class="back-link">
        <a routerLink="/" class="btn btn-outline-secondary btn-sm">
          <i class="fas fa-arrow-left"></i> Voltar ao site
        </a>
      </div>

      <router-outlet></router-outlet>
    </div>
  </div>
</div>
