services:
  db:
    image: postgres:15
    container_name: animalworld_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: animalworld
      POSTGRES_PASSWORD: animalworld
      POSTGRES_DB: animalworld
    ports:
      - "5433:5432"
    volumes:
      - animalworld_pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animalworld -d animalworld"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    container_name: animalworld_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3100
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: animalworld
      DB_PASSWORD: animalworld
      DB_NAME: animalworld
      SESSION_SECRET: ${SESSION_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "3100:3100"

volumes:
  animalworld_pgdata:
