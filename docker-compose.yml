services:
  db:
    image: postgres:15
    container_name: animalworld_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: animalworld
      POSTGRES_PASSWORD: animalworld
      POSTGRES_DB: animalworld
    ports:
      - "5433:5432"
    volumes:
      - animalworld_pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animalworld -d animalworld"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  animalworld_pgdata:
