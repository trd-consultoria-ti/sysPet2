services:
  db:
    image: postgres:15
    container_name: animalworld_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: animalworld
      POSTGRES_PASSWORD: animalworld
      POSTGRES_DB: animalworld
    ports:
      - "5433:5432"
    volumes:
      - animalworld_pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animalworld -d animalworld"]
      interval: 5s
      timeout: 5s
      retries: 10

  evolution_api:
    image: atendai/evolution-api:v2.3.7
    container_name: syspet_evolution_api
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_TYPE=http
      - SERVER_URL=http://localhost:8080
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      - CORS_CREDENTIALS=true
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=syspet-evolution-key-2026
      - DATABASE_ENABLED=false
      - CONFIG_SESSION_PHONE_CLIENT=SysPet2
      - STORE_MESSAGES=true
      - STORE_MESSAGE_UP=true
      - STORE_CONTACTS=true
      - STORE_CHATS=true
    volumes:
      - syspet_evolution_instances:/evolution/instances
      - syspet_evolution_store:/evolution/store

  api:
    build: ./server
    container_name: animalworld_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      evolution_api:
        condition: service_started
    environment:
      PORT: 3100
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: animalworld
      DB_PASSWORD: animalworld
      DB_NAME: animalworld
      SESSION_SECRET: ${SESSION_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3100}
      EVOLUTION_API_URL: http://evolution_api:8080
      EVOLUTION_API_KEY: syspet-evolution-key-2026
      EVOLUTION_INSTANCE: syspet-oficial
    ports:
      - "3100:3100"
    volumes:
      - ./docs:/docs:ro
      - ./server/uploads:/app/uploads

volumes:
  animalworld_pgdata:
  syspet_evolution_instances:
  syspet_evolution_store:
