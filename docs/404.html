<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <title>Animal World - Página Não Encontrada</title>
    <script>
        // Redirecionar para a aplicação principal com preservação da rota
        var segmentCount = 1;
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/#' +
            l.pathname.slice(1).split('/').slice(segmentCount).join('/') +
            (l.search ? l.search : '') +
            l.hash
        );
    </script>
    <meta http-equiv="refresh" content="0;URL='https://trd-consultoria-ti.github.io/sysPet2/'" />
</head>
